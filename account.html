<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="robots" content="noindex" />
  <title>Личный кабинет — Stas Trotsky</title>

  <link rel="icon" href="img/favicon-light.png" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="img/favicon-dark.png" media="(prefers-color-scheme: light)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --radius-xl: 28px; --radius-lg: 22px; --radius-md: 16px;
      --font: 'Montserrat', sans-serif;
      --blur: 24px;
      --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    [data-theme="dark"] {
      --bg-1: #0a0e1a; --bg-orb-1: rgba(90,40,160,0.45); --bg-orb-2: rgba(20,80,180,0.35); --bg-orb-3: rgba(160,30,80,0.55);
      --glass-bg: rgba(255,255,255,0.06); --glass-border: rgba(255,255,255,0.12); --glass-hover: rgba(255,255,255,0.10);
      --text-primary: #fff; --text-secondary: rgba(255,255,255,0.65); --text-muted: rgba(255,255,255,0.4);
      --accent: #a855f7; --accent-2: #ec4899;
      --shadow: 0 8px 40px rgba(0,0,0,0.4); --shadow-sm: 0 2px 16px rgba(0,0,0,0.3);
    }
    [data-theme="light"] {
      --bg-1: #e8eaf5; --bg-orb-1: rgba(168,85,247,0.2); --bg-orb-2: rgba(59,130,246,0.15); --bg-orb-3: rgba(236,72,153,0.35);
      --glass-bg: rgba(255,255,255,0.55); --glass-border: rgba(255,255,255,0.8); --glass-hover: rgba(255,255,255,0.75);
      --text-primary: #111827; --text-secondary: rgba(17,24,39,0.7); --text-muted: rgba(17,24,39,0.45);
      --accent: #7c3aed; --accent-2: #db2777;
      --shadow: 0 8px 40px rgba(0,0,0,0.12); --shadow-sm: 0 2px 16px rgba(0,0,0,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; background-color: var(--bg-1); min-height: 100dvh; }
    body { font-family: var(--font); background-color: var(--bg-1); color: var(--text-primary);
           min-height: 100dvh; overflow-x: hidden; transition: background-color var(--transition), color var(--transition); color-scheme: dark light; }

    .bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; background-color: var(--bg-1); }
    .orb { position: absolute; border-radius: 50%; filter: blur(80px); animation: drift 18s ease-in-out infinite alternate; }
    .orb-1 { width:600px;height:600px;background:var(--bg-orb-1);top:50px;left:-50px;animation-duration:20s; }
    .orb-2 { width:500px;height:500px;background:var(--bg-orb-2);top:30%;right:-80px;animation-duration:25s;animation-delay:-5s; }
    .orb-3 { width:600px;height:600px;background:var(--bg-orb-3);bottom:-50px;left:10%;animation-duration:22s;animation-delay:-10s; }
    @keyframes drift {
      0%   { transform: translate(0,0) scale(1); }
      33%  { transform: translate(40px,-30px) scale(1.05); }
      66%  { transform: translate(-20px,40px) scale(0.97); }
      100% { transform: translate(20px,10px) scale(1.02); }
    }

    /* Navbar */
    .navbar { position: fixed; top: 18px; left: 0; right: 0; z-index: 1000; display: flex;
              justify-content: center; align-items: center; gap: 8px; pointer-events: none; }
    .nav-bubble { pointer-events: all; height: 46px; padding: 0 18px; border-radius: 50px;
                  background: var(--glass-bg); border: 1px solid var(--glass-border);
                  backdrop-filter: blur(var(--blur)) saturate(1.8); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.8);
                  display: flex; align-items: center; gap: 8px; font-family: var(--font);
                  font-size: 14px; font-weight: 600; color: var(--text-primary);
                  cursor: pointer; text-decoration: none; transition: background 0.2s; box-shadow: var(--shadow-sm); }
    .nav-bubble:hover { background: var(--glass-hover); }
    .nav-logo-bubble img { height: 28px; display: block; }
    [data-theme="light"] .nav-logo-bubble img { content: url('img/logo-black.png'); }
    .nav-btn { background: none; border: none; padding: 0 8px; font: inherit; color: inherit; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .nav-user-bubble { font-size: 13px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Page */
    .page-wrapper { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 100px 20px 60px; }

    /* Page heading */
    .page-heading { font-size: 22px; font-weight: 800; margin-bottom: 16px; text-align: center; }

    /* Glass card */
    .card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-xl);
            backdrop-filter: blur(var(--blur)) saturate(1.6); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.6);
            overflow: hidden; box-shadow: var(--shadow); }

    /* Purchase list items */
    .purchase-item { display: flex; align-items: center; gap: 14px; padding: 16px 20px;
                     border-bottom: 1px solid var(--glass-border); transition: background 0.2s; }
    .purchase-item:last-child { border-bottom: none; }
    .purchase-item:hover { background: var(--glass-hover); }
    .purchase-icon { font-size: 22px; flex-shrink: 0; width: 40px; text-align: center; }
    .purchase-title { flex: 1; font-size: 14px; font-weight: 700; min-width: 0; }
    .purchase-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .btn-go { display: inline-flex; align-items: center; gap: 6px; background: rgba(168,85,247,0.18);
              border: 1px solid rgba(168,85,247,0.35); border-radius: 50px; padding: 7px 16px;
              font-family: var(--font); font-size: 12px; font-weight: 700; color: var(--accent);
              text-decoration: none; transition: background 0.2s; flex-shrink: 0; }
    .btn-go:hover { background: rgba(168,85,247,0.32); }

    /* Empty state */
    .empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
    .empty-state-icon { font-size: 36px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; line-height: 1.6; }

    /* Footer row */
    .footer-row { display: flex; justify-content: flex-end; margin-top: 20px; }
    .btn-logout { background: rgba(168,85,247,0.18); border: 1px solid rgba(168,85,247,0.35); border-radius: 50px;
                  padding: 10px 22px; font-family: var(--font); font-size: 13px; font-weight: 700;
                  color: var(--accent); cursor: pointer; transition: background 0.2s; }
    .btn-logout:hover { background: rgba(168,85,247,0.32); }

    @media (max-width: 600px) { .page-wrapper { padding: 90px 14px 40px; } }
  </style>
</head>
<body>
  <div class="bg-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <nav class="navbar">
    <a href="/" class="nav-bubble nav-logo-bubble">
      <img src="img/logo.png" alt="ST" />
    </a>
    <div class="nav-bubble nav-user-bubble" id="nav-user">—</div>
    <div class="nav-bubble">
      <button class="nav-btn" id="theme-toggle" onclick="toggleTheme()">🌙</button>
    </div>
  </nav>

  <main class="page-wrapper" id="page-content" style="display:none">
    <div class="page-heading">Мои покупки</div>
    <div class="card" id="purchases-card">
      <div class="empty-state">
        <div class="empty-state-icon">🛍️</div>
        <p>Загрузка…</p>
      </div>
    </div>
    <div class="footer-row">
      <button class="btn-logout" onclick="handleLogout()">Выйти</button>
    </div>
  </main>

  <script>
    const html = document.documentElement;
    function setTheme(t) {
      html.dataset.theme = t;
      const btn = document.getElementById('theme-toggle');
      if (btn) btn.textContent = t === 'dark' ? '🌙' : '☀️';
      localStorage.setItem('st-theme', t);
    }
    function toggleTheme() { setTheme(html.dataset.theme === 'dark' ? 'light' : 'dark'); }
    setTheme(localStorage.getItem('st-theme') || 'dark');
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const app = initializeApp({
      apiKey: "AIzaSyCOkfOnGEm7D1Dic0hUnZBNkvMAKi_sGHM",
      authDomain: "stas-trotsky.firebaseapp.com",
      projectId: "stas-trotsky",
      storageBucket: "stas-trotsky.firebasestorage.app",
      messagingSenderId: "299023334744",
      appId: "1:299023334744:web:6e762caf8838d31d61792d"
    });
    const auth = getAuth(app);
    const db   = getFirestore(app);

    const PRODUCTS = {
      'video-xxx': {
        title: 'Видео XXX',
        icon: '🔞',
        url: '/hot',
      },
      'course-oral-art': {
        title: 'Курс «Оральное Искусство»',
        icon: '🎬',
        url: '/oral',
      },
      'course-anal-art': {
        title: 'Курс «Анальное Искусство»',
        icon: '🔥',
        url: '/anal',
      },
      'course-jff': {
        title: 'Курс «JustForFans»',
        icon: '⭐',
        url: '/jff',
      },
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        location.href = '/?login=1';
        return;
      }

      document.getElementById('page-content').style.display = '';

      const snap = await getDoc(doc(db, 'users', user.uid));
      const data = snap.exists() ? snap.data() : {};
      const name = data.displayName || user.displayName || user.email.split('@')[0];
      document.getElementById('nav-user').textContent = name;

      const purchases = data.purchases || [];
      const card = document.getElementById('purchases-card');

      if (purchases.length === 0) {
        card.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🛍️</div>
            <p>Здесь будут ваши покупки</p>
          </div>`;
        return;
      }

      card.innerHTML = '';
      purchases.forEach(id => {
        const p = PRODUCTS[id];
        if (!p) return;
        const item = document.createElement('div');
        item.className = 'purchase-item';
        item.innerHTML = `
          <div class="purchase-icon">${p.icon}</div>
          <div style="flex:1;min-width:0">
            <div class="purchase-title">${p.title}</div>
            <div class="purchase-meta">Полный доступ</div>
          </div>
          <a class="btn-go" href="${p.url}">Перейти →</a>`;
        card.appendChild(item);
      });
    });

    window.handleLogout = async function() {
      await signOut(auth);
      location.href = '/';
    };
  </script>
</body>
</html>
