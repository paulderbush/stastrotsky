<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Видео — Stas Trotsky</title>
  <link rel="icon" href="../img/favicon-light.png" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="../img/favicon-dark.png" media="(prefers-color-scheme: light)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--radius-xl:28px;--radius-lg:18px;--radius-md:14px;--font:'Montserrat',sans-serif;--blur:24px;--transition:0.35s cubic-bezier(0.4,0,0.2,1)}
    [data-theme="dark"]{--bg-1:#0a0e1a;--bg-orb-1:rgba(90,40,160,0.45);--bg-orb-2:rgba(20,80,180,0.35);--bg-orb-3:rgba(160,30,80,0.55);--glass-bg:rgba(255,255,255,0.06);--glass-border:rgba(255,255,255,0.12);--glass-hover:rgba(255,255,255,0.09);--text-primary:#fff;--text-secondary:rgba(255,255,255,0.65);--text-muted:rgba(255,255,255,0.4);--accent:#a855f7;--accent-2:#ec4899;--shadow:0 8px 40px rgba(0,0,0,0.4);--shadow-sm:0 2px 16px rgba(0,0,0,0.3);--nav-bg:rgba(15,20,40,0.82);--nav-border:rgba(255,255,255,0.1)}
    [data-theme="light"]{--bg-1:#e8eaf5;--bg-orb-1:rgba(168,85,247,0.2);--bg-orb-2:rgba(59,130,246,0.15);--bg-orb-3:rgba(236,72,153,0.35);--glass-bg:rgba(255,255,255,0.55);--glass-border:rgba(255,255,255,0.8);--glass-hover:rgba(255,255,255,0.75);--text-primary:#111827;--text-secondary:rgba(17,24,39,0.7);--text-muted:rgba(17,24,39,0.45);--accent:#7c3aed;--accent-2:#db2777;--shadow:0 8px 40px rgba(0,0,0,0.12);--shadow-sm:0 2px 16px rgba(0,0,0,0.08);--nav-bg:rgba(230,230,245,0.88);--nav-border:rgba(255,255,255,0.9)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;background-color:var(--bg-1);min-height:100dvh}
    body{font-family:var(--font);background-color:var(--bg-1);color:var(--text-primary);min-height:100dvh;overflow-x:hidden;transition:background-color var(--transition),color var(--transition);color-scheme:dark light}
    .bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;background-color:var(--bg-1)}
    .orb{position:absolute;border-radius:50%;filter:blur(80px);animation:drift 18s ease-in-out infinite alternate}
    .orb-1{width:600px;height:600px;background:var(--bg-orb-1);top:50px;left:-50px;animation-duration:20s}
    .orb-2{width:500px;height:500px;background:var(--bg-orb-2);top:30%;right:-80px;animation-duration:25s;animation-delay:-5s}
    .orb-3{width:600px;height:600px;background:var(--bg-orb-3);bottom:-50px;left:10%;animation-duration:22s;animation-delay:-10s}
    @keyframes drift{0%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.05)}66%{transform:translate(-20px,40px) scale(0.97)}100%{transform:translate(20px,10px) scale(1.02)}}
    /* NAVBAR */
    .navbar{position:fixed;top:18px;left:0;right:0;z-index:1000;display:flex;justify-content:center;align-items:center;gap:10px;padding:0 20px;pointer-events:none}
    .nav-bubble{background:var(--nav-bg);backdrop-filter:blur(var(--blur)) saturate(1.8);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.8);border:1px solid var(--nav-border);border-radius:50px;display:flex;align-items:center;gap:4px;height:46px;padding:0 14px;pointer-events:all;box-shadow:var(--shadow-sm);transition:background var(--transition),border-color var(--transition)}
    .nav-logo-bubble{padding:8px 14px}
    .nav-logo-bubble a{display:flex;align-items:center;text-decoration:none}
    .nav-logo-bubble img{height:32px;width:auto;display:block}
    [data-theme="light"] .nav-logo-bubble img{content:url('../img/logo-black.png')}
    .nav-menu{gap:4px}
    .nav-menu a{font-size:14px;font-weight:500;color:var(--text-secondary);text-decoration:none;padding:6px 14px;border-radius:50px;transition:background 0.2s,color 0.2s}
    .nav-menu a:hover,.nav-menu a.active{background:rgba(168,85,247,0.18);color:var(--text-primary)}
    .nav-menu a.active{background:rgba(168,85,247,0.25);font-weight:600}
    .nav-controls{gap:6px}
    .nav-btn{background:none;border:none;cursor:pointer;color:var(--text-secondary);padding:6px 10px;border-radius:50px;font-size:15px;font-family:var(--font);font-weight:600;transition:background 0.2s,color 0.2s;display:flex;align-items:center;justify-content:center;line-height:1}
    .nav-btn:hover{background:rgba(168,85,247,0.15);color:var(--text-primary)}
    .nav-btn.lang-active{color:var(--text-primary)}
    .nav-divider{width:1px;height:18px;background:var(--nav-border);flex-shrink:0}
    .nav-login-bubble{padding:8px 16px}
    .nav-login-btn{background:none;border:none;cursor:pointer;color:var(--text-secondary);font-size:13px;font-family:var(--font);font-weight:600;padding:0;letter-spacing:0.03em;transition:color 0.2s;display:flex;align-items:center;gap:6px;text-decoration:none}
    .nav-login-btn:hover{color:var(--accent)}
    .nav-login-btn svg{width:16px;height:16px}
    .nav-hamburger{display:none;pointer-events:all;background:var(--nav-bg);backdrop-filter:blur(var(--blur)) saturate(1.8);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.8);border:1px solid var(--nav-border);border-radius:50px;width:44px;height:44px;cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0}
    .nav-hamburger span{display:block;width:18px;height:2px;background:var(--text-primary);border-radius:2px}
    .mobile-menu-overlay{display:none;position:fixed;top:0;left:0;right:0;height:100dvh;z-index:2000;background:rgba(0,0,0,0.55);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);flex-direction:column;align-items:center;justify-content:space-between;padding:70px 32px 24px}
    .mobile-menu-overlay.open{display:flex}
    body.menu-open .page-wrapper,body.menu-open .bg-canvas{filter:blur(4px)}
    .mobile-menu-close{position:absolute;top:24px;right:24px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.18);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-primary);font-size:20px;line-height:1}
    .mobile-menu-close:hover{background:rgba(255,255,255,0.2)}
    .mobile-menu-link{font-size:28px;font-weight:700;color:rgba(255,255,255,0.75);text-decoration:none;letter-spacing:-0.02em;padding:12px 32px;border-radius:50px;transition:background 0.2s,color 0.2s;width:100%;text-align:center}
    .mobile-menu-link:hover,.mobile-menu-link.active{background:rgba(168,85,247,0.2);color:#fff}
    .mob-menu-nav{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%}
    .mob-menu-settings{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);border-radius:50px;padding:6px 12px;margin-bottom:16px}
    .mob-settings-btn{background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.7);padding:6px 12px;border-radius:50px;font-size:15px;font-family:var(--font);font-weight:600;transition:background 0.2s,color 0.2s}
    .mob-settings-btn:hover,.mob-settings-btn.mob-lang-active{background:rgba(168,85,247,0.25);color:#fff}
    .mob-settings-divider{width:1px;height:18px;background:rgba(255,255,255,0.2);flex-shrink:0;margin:0 4px}
    @media(max-width:600px){
      .navbar{left:14px;right:14px;top:14px;gap:0;background:var(--nav-bg);backdrop-filter:blur(var(--blur)) saturate(1.8);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.8);border:1px solid var(--nav-border);border-radius:50px;padding:5px 8px;box-shadow:var(--shadow-sm);justify-content:flex-start}
      .nav-bubble{background:none!important;border:none!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;padding:4px 6px}
      .nav-hamburger{background:none!important;border:none!important;box-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
      .nav-menu{display:none}.nav-controls{display:none}
      .nav-logo-bubble{order:1}.nav-login-bubble{order:2;margin-left:auto}.nav-hamburger{display:flex;order:3;margin-left:4px}
      #nav-account-label{display:none}.nav-login-btn{gap:0}
    }
    /* PAGE */
    .page-wrapper{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:100px 20px 60px}
    .page-heading{font-size:28px;font-weight:800;margin-bottom:6px}
    .page-subheading{font-size:14px;color:var(--text-muted);margin-bottom:32px;font-weight:500}
    /* VIDEO CARD */
    .video-card{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-xl);overflow:hidden;margin-bottom:24px;transition:border-color 0.2s}
    .video-card:hover{border-color:rgba(168,85,247,0.3)}
    .video-thumb-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;cursor:pointer;overflow:hidden}
    .video-thumb{width:100%;height:100%;object-fit:cover;display:block;transition:opacity 0.2s}
    .video-thumb-wrap:hover .video-thumb{opacity:0.85}
    .video-play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;background:rgba(255,255,255,0.92);border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:transform 0.2s}
    .video-thumb-wrap:hover .video-play-btn{transform:translate(-50%,-50%) scale(1.1)}
    .video-play-btn svg{width:26px;height:26px;margin-left:4px}
    .video-duration{position:absolute;bottom:10px;right:12px;background:rgba(0,0,0,0.75);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:0.04em}
    .video-embed{width:100%;aspect-ratio:16/9;background:#000;display:block;border:none}
    .video-body{padding:18px 20px 0}
    .video-title{font-size:17px;font-weight:700;margin-bottom:4px;line-height:1.3}
    .video-meta{font-size:12px;color:var(--text-muted);margin-bottom:14px;font-weight:500}
    .loading-text{text-align:center;padding:40px;color:var(--text-muted);font-size:14px}
    .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
    .empty-icon{font-size:48px;margin-bottom:14px}
    .empty-text{font-size:15px;line-height:1.6}
    .admin-del-btn{background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:2px 6px;border-radius:6px;transition:color 0.2s;margin-left:8px;vertical-align:middle}
    .admin-del-btn:hover{color:#ef4444}
    /* REACTIONS */
    .reactions-row{display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--glass-border)}
    .react-btn{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--glass-border);border-radius:50px;padding:6px 14px;font-size:13px;font-weight:600;font-family:var(--font);color:var(--text-secondary);cursor:pointer;transition:background 0.2s,border-color 0.2s,color 0.2s}
    .react-btn:hover{background:rgba(168,85,247,0.12);border-color:rgba(168,85,247,0.3);color:var(--text-primary)}
    .react-btn.active-like{background:rgba(168,85,247,0.18);border-color:rgba(168,85,247,0.5);color:var(--accent)}
    .react-btn.active-dislike{background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.4);color:#f87171}
    .react-count{font-size:13px;font-weight:700}
    .toggle-comments-btn{margin-left:auto;background:none;border:none;font-family:var(--font);font-size:12px;font-weight:600;color:var(--text-muted);cursor:pointer;padding:6px 10px;border-radius:50px;transition:color 0.2s,background 0.2s}
    .toggle-comments-btn:hover{color:var(--accent);background:rgba(168,85,247,0.1)}
    /* COMMENTS */
    .comments-section{border-top:1px solid var(--glass-border);padding:16px 20px 20px;display:none}
    .comments-section.open{display:block}
    .comment-item{padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
    .comment-item:last-child{border-bottom:none;padding-bottom:0}
    .comment-text{font-size:13px;color:var(--text-secondary);line-height:1.5}
    .comment-time-row{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
    .comment-time{font-size:11px;color:var(--text-muted)}
    .comment-like-btn{background:none;border:1px solid var(--glass-border);border-radius:50px;padding:2px 10px;font-size:11px;font-family:var(--font);color:var(--text-muted);cursor:pointer;transition:background 0.2s,color 0.2s}
    .comment-like-btn:hover{background:rgba(168,85,247,0.12);color:var(--accent);border-color:rgba(168,85,247,0.3)}
    .comment-reply-btn{background:none;border:none;font-size:11px;font-family:var(--font);color:var(--text-muted);cursor:pointer;padding:2px 4px;transition:color 0.2s}
    .comment-reply-btn:hover{color:var(--accent)}
    .replies-list{margin-top:8px;margin-left:12px;padding-left:12px;border-left:2px solid var(--glass-border)}
    .reply-item{padding:7px 0}
    .reply-item+.reply-item{border-top:1px solid rgba(255,255,255,0.04)}
    .reply-form{display:none}
    .reply-form.open{display:block}
    .comment-form{display:flex;flex-direction:column;gap:8px;margin-top:14px}
    .comment-input{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:10px 14px;font-family:var(--font);font-size:13px;color:var(--text-primary);outline:none;transition:border-color 0.2s;width:100%}
    .comment-input:focus{border-color:var(--accent)}
    .comment-input::placeholder{color:var(--text-muted)}
    .comment-row{display:flex;gap:8px}
    .comment-name{flex:1}
    .send-comment-btn{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;border-radius:50px;padding:10px 20px;font-family:var(--font);font-size:12px;font-weight:700;color:#fff;cursor:pointer;transition:opacity 0.2s;white-space:nowrap}
    .send-comment-btn:hover{opacity:0.85}
    .no-comments{font-size:13px;color:var(--text-muted);padding:8px 0;font-style:italic}
    .site-footer{text-align:center;padding:32px 24px 24px;position:relative;z-index:1;font-size:13px;color:var(--text-muted);font-weight:500}
    @media(max-width:600px){.page-wrapper{padding:90px 14px 40px}.comment-row{flex-direction:column}}
  </style>
</head>
<body>
  <div class="bg-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <nav class="navbar">
    <div class="nav-bubble nav-logo-bubble">
      <a href="/"><img src="../img/logo.png" alt="ST" /></a>
    </div>
    <div class="nav-bubble nav-menu">
      <a href="/" id="nav-home"></a>
      <a href="/store" id="nav-store"></a>
      <a href="/news" id="nav-news"></a>
      <a href="/video" class="active" id="nav-video"></a>
    </div>
    <button class="nav-hamburger" onclick="openMobileMenu()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-bubble nav-controls">
      <button class="nav-btn" id="theme-toggle" onclick="toggleTheme()">🌙</button>
      <div class="nav-divider"></div>
      <button class="nav-btn lang-active" onclick="setLang('ru')" id="btn-ru">RU</button>
      <button class="nav-btn" onclick="setLang('en')" id="btn-en">EN</button>
    </div>
    <div class="nav-bubble nav-login-bubble">
      <a class="nav-login-btn" href="/account.html" id="nav-account">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        <span id="nav-account-label"></span>
      </a>
    </div>
  </nav>

  <div class="mobile-menu-overlay" id="mobile-menu" onclick="closeMobileMenuOutside(event)">
    <button class="mobile-menu-close" onclick="closeMobileMenu()" aria-label="Close">✕</button>
    <div class="mob-menu-nav">
      <a href="/" class="mobile-menu-link" id="mob-nav-home" onclick="closeMobileMenu()"></a>
      <a href="/store" class="mobile-menu-link" id="mob-nav-store" onclick="closeMobileMenu()"></a>
      <a href="/news" class="mobile-menu-link" id="mob-nav-news" onclick="closeMobileMenu()"></a>
      <a href="/video" class="mobile-menu-link active" id="mob-nav-video" onclick="closeMobileMenu()"></a>
    </div>
    <div class="mob-menu-settings">
      <button class="mob-settings-btn" id="mob-theme-toggle" onclick="toggleTheme()">🌙</button>
      <div class="mob-settings-divider"></div>
      <button class="mob-settings-btn mob-lang-active" onclick="setLang('ru');closeMobileMenu();" id="mob-btn-ru">RU</button>
      <button class="mob-settings-btn" onclick="setLang('en');closeMobileMenu();" id="mob-btn-en">EN</button>
    </div>
  </div>

  <main class="page-wrapper">
    <div class="page-heading" id="page-heading">Видео</div>
    <div class="page-subheading" id="page-subheading">Все видео Stas Trotsky</div>
    <div id="videos-container"></div>
  </main>

  <footer class="site-footer">© 2018 – 2026 Stas Trotsky Media</footer>

  <script>
    /* THEME */
    const html = document.documentElement;
    function setTheme(t) {
      html.dataset.theme = t;
      const btn = document.getElementById('theme-toggle');
      const mob = document.getElementById('mob-theme-toggle');
      if (btn) btn.textContent = t === 'dark' ? '🌙' : '☀️';
      if (mob) mob.textContent = t === 'dark' ? '🌙' : '☀️';
      localStorage.setItem('st-theme', t);
    }
    function toggleTheme() { setTheme(html.dataset.theme === 'dark' ? 'light' : 'dark'); }
    setTheme(localStorage.getItem('st-theme') || 'dark');

    /* MOBILE MENU */
    function openMobileMenu() {
      document.getElementById('mobile-menu').classList.add('open');
      document.body.classList.add('menu-open');
    }
    function closeMobileMenu() {
      document.getElementById('mobile-menu').classList.remove('open');
      document.body.classList.remove('menu-open');
    }
    function closeMobileMenuOutside(e) {
      if (e.target === document.getElementById('mobile-menu')) closeMobileMenu();
    }

    /* LANGUAGE */
    const navStrings = {
      ru: { home:'Главная', store:'Магазин', news:'Новости', video:'Видео', account:'Кабинет', heading:'Видео', subheading:'Все видео Stas Trotsky', namePlaceholder:'Ваше имя', commentPlaceholder:'Написать комментарий…', sendBtn:'Отправить', noComments:'Комментариев пока нет', showComments:'Комментарии', hideComments:'Скрыть' },
      en: { home:'Home', store:'Store', news:'News', video:'Video', account:'Account', heading:'Videos', subheading:'All videos by Stas Trotsky', namePlaceholder:'Your name', commentPlaceholder:'Write a comment…', sendBtn:'Send', noComments:'No comments yet', showComments:'Comments', hideComments:'Hide' }
    };
    let currentLang = localStorage.getItem('st-lang') || 'ru';

    function applyLang(lang) {
      currentLang = lang;
      localStorage.setItem('st-lang', lang);
      const t = navStrings[lang];
      document.getElementById('nav-home').textContent = t.home;
      document.getElementById('nav-store').textContent = t.store;
      document.getElementById('nav-news').textContent = t.news;
      document.getElementById('nav-video').textContent = t.video;
      document.getElementById('mob-nav-home').textContent = t.home;
      document.getElementById('mob-nav-store').textContent = t.store;
      document.getElementById('mob-nav-news').textContent = t.news;
      document.getElementById('mob-nav-video').textContent = t.video;
      document.getElementById('nav-account-label').textContent = t.account;
      document.getElementById('btn-ru').classList.toggle('lang-active', lang === 'ru');
      document.getElementById('btn-en').classList.toggle('lang-active', lang === 'en');
      document.getElementById('mob-btn-ru').classList.toggle('mob-lang-active', lang === 'ru');
      document.getElementById('mob-btn-en').classList.toggle('mob-lang-active', lang === 'en');
      document.getElementById('page-heading').textContent = t.heading;
      document.getElementById('page-subheading').textContent = t.subheading;
      document.querySelectorAll('[data-comment-name-placeholder]').forEach(el => el.placeholder = t.namePlaceholder);
      document.querySelectorAll('[data-comment-text-placeholder]').forEach(el => el.placeholder = t.commentPlaceholder);
      document.querySelectorAll('[data-send-btn]').forEach(el => el.textContent = t.sendBtn);
    }
    function setLang(lang) { applyLang(lang); }
    applyLang(currentLang);

  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    import {
      getFirestore, collection, doc, updateDoc,
      addDoc, getDocs, query, orderBy, serverTimestamp, increment
    } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const app = initializeApp({
      apiKey: "AIzaSyCOkfOnGEm7D1Dic0hUnZBNkvMAKi_sGHM",
      authDomain: "stas-trotsky.firebaseapp.com",
      projectId: "stas-trotsky",
      storageBucket: "stas-trotsky.firebasestorage.app",
      messagingSenderId: "299023334744",
      appId: "1:299023334744:web:6e762caf8838d31d61792d"
    });
    const auth = getAuth(app);
    const db   = getFirestore(app);

    onAuthStateChanged(auth, (user) => {
      const label = document.getElementById('nav-account-label');
      if (user) label.textContent = user.displayName || user.email.split('@')[0];
    });

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function voteKey(id) { return 'st_vvote_' + id; }

    function timeAgo(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      const diff = Math.floor((Date.now() - d.getTime()) / 1000);
      if (diff < 60) return 'только что';
      if (diff < 3600) return Math.floor(diff/60) + ' мин. назад';
      if (diff < 86400) return Math.floor(diff/3600) + ' ч. назад';
      return d.toLocaleDateString('ru-RU');
    }

    function buildCommentEl(c, replies, videoId, isReply) {
      const wrap = document.createElement('div');
      wrap.className = isReply ? 'reply-item' : 'comment-item';

      const likes = c.likes || 0;
      wrap.innerHTML = `
        <div class="comment-text">${escHtml(c.text||'')}</div>
        <div class="comment-time-row">
          <span class="comment-time">${timeAgo(c.createdAt)}</span>
          <button class="comment-like-btn" data-cid="${c.id}" data-vid="${videoId}">❤️ ${likes}</button>
          ${!isReply ? `<button class="comment-reply-btn" data-cid="${c.id}" data-vid="${videoId}">Ответить</button>` : ''}
        </div>
        ${!isReply && replies && replies.length ? `<div class="replies-list" id="vreplies-${c.id}"></div>` : ''}
        ${!isReply ? `<div class="reply-form" id="vrf-${c.id}">
          <div class="comment-row" style="margin-top:6px">
            <input class="comment-input" id="vri-${c.id}" placeholder="Ответить…" />
            <button class="send-comment-btn" data-rfor="${c.id}" data-vid="${videoId}">↩</button>
          </div>
        </div>` : ''}`;

      if (!isReply && replies && replies.length) {
        const repliesEl = wrap.querySelector(`#vreplies-${c.id}`);
        if (repliesEl) replies.forEach(r => repliesEl.appendChild(buildCommentEl(r, [], videoId, true)));
      }

      wrap.querySelector('.comment-like-btn').addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        const cid = btn.dataset.cid;
        const vid = btn.dataset.vid;
        await updateDoc(doc(db, 'videos', vid, 'comments', cid), { likes: increment(1) });
        const cur = parseInt(btn.textContent.replace('❤️','').trim()) || 0;
        btn.textContent = '❤️ ' + (cur + 1);
      });

      const replyBtn = wrap.querySelector('.comment-reply-btn');
      if (replyBtn) {
        replyBtn.addEventListener('click', () => {
          const rf = wrap.querySelector(`#vrf-${c.id}`);
          if (rf) { rf.classList.toggle('open'); if (rf.classList.contains('open')) wrap.querySelector(`#vri-${c.id}`)?.focus(); }
        });
      }

      const sendReplyBtn = wrap.querySelector('[data-rfor]');
      if (sendReplyBtn) {
        sendReplyBtn.addEventListener('click', async () => {
          const input = wrap.querySelector(`#vri-${sendReplyBtn.dataset.rfor}`);
          const text = input ? input.value.trim() : '';
          if (!text) return;
          await addDoc(collection(db, 'videos', sendReplyBtn.dataset.vid, 'comments'), {
            author: '', text, parentId: sendReplyBtn.dataset.rfor, createdAt: serverTimestamp()
          });
          if (input) input.value = '';
          const rf = wrap.querySelector(`#vrf-${sendReplyBtn.dataset.rfor}`);
          if (rf) rf.classList.remove('open');
          const repliesEl = wrap.querySelector(`#vreplies-${sendReplyBtn.dataset.rfor}`);
          if (repliesEl) {
            const newReply = buildCommentEl({ id: 'tmp', text, createdAt: null, likes: 0 }, [], sendReplyBtn.dataset.vid, true);
            repliesEl.appendChild(newReply);
          }
        });
      }

      return wrap;
    }

    async function refreshComments(videoId, card) {
      const t = navStrings[localStorage.getItem('st-lang')||'ru'];
      const listEl = card.querySelector(`#vc-list-${videoId}`);
      listEl.innerHTML = '';
      const q = query(collection(db,'videos',videoId,'comments'), orderBy('createdAt','asc'));
      const snap = await getDocs(q);
      const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (all.length === 0) {
        const p = document.createElement('p');
        p.className = 'no-comments';
        p.textContent = t.noComments;
        listEl.appendChild(p);
        return;
      }
      const topLevel = all.filter(c => !c.parentId);
      const byParent = {};
      all.filter(c => c.parentId).forEach(r => {
        if (!byParent[r.parentId]) byParent[r.parentId] = [];
        byParent[r.parentId].push(r);
      });
      topLevel.forEach(c => listEl.appendChild(buildCommentEl(c, byParent[c.id] || [], videoId, false)));
    }

    function buildVideoCard(v) {
      const t = navStrings[localStorage.getItem('st-lang')||'ru'];
      const myVote   = localStorage.getItem(voteKey(v.id));
      const likes    = v.likes || 0;
      const dislikes = v.dislikes || 0;
      const views    = v.views || 0;
      const thumb    = v.thumbnailURL || '';
      const duration = v.duration || '';

      const card = document.createElement('div');
      card.className = 'video-card';
      card.innerHTML = `
        <div class="video-thumb-wrap" id="vthumb-${v.id}">
          ${thumb
            ? `<img class="video-thumb" src="${escHtml(thumb)}" alt="${escHtml(v.title||'')}" loading="lazy" />`
            : `<div style="width:100%;height:100%;background:#111"></div>`}
          ${duration ? `<div class="video-duration">${escHtml(duration)}</div>` : ''}
          <div class="video-play-btn">
            <svg viewBox="0 0 24 24" fill="#111"><polygon points="5,3 19,12 5,21"/></svg>
          </div>
        </div>
        <div class="video-body">
          <div class="video-title">${escHtml(v.title||'')}</div>
          <div class="video-meta" id="vmeta-${v.id}">${views} просмотров</div>
        </div>
        <div class="reactions-row">
          <button class="react-btn ${myVote==='like'?'active-like':''}" id="vl-${v.id}">
            👍 <span class="react-count" id="vl-c-${v.id}">${likes}</span>
          </button>
          <button class="react-btn ${myVote==='dislike'?'active-dislike':''}" id="vd-${v.id}">
            👎 <span class="react-count" id="vd-c-${v.id}">${dislikes}</span>
          </button>
          <button class="toggle-comments-btn" id="vtog-${v.id}" data-open="0">${t.showComments}</button>
        </div>
        <div class="comments-section" id="vc-${v.id}">
          <div class="comments-list" id="vc-list-${v.id}"></div>
          <div class="comment-form">
            <div class="comment-row">
              <input class="comment-input" id="vt-${v.id}" placeholder="${t.commentPlaceholder}" />
              <button class="send-comment-btn" id="vs-${v.id}">${t.sendBtn}</button>
            </div>
          </div>
        </div>`;

      /* play: load Kinescope iframe + increment views */
      card.querySelector(`#vthumb-${v.id}`).addEventListener('click', async () => {
        const wrap = card.querySelector(`#vthumb-${v.id}`);
        const iframe = document.createElement('iframe');
        iframe.className = 'video-embed';
        iframe.src = `https://kinescope.io/embed/${v.kinescopeID}?autoplay=1`;
        iframe.allow = 'autoplay; fullscreen; picture-in-picture';
        iframe.allowFullscreen = true;
        wrap.replaceWith(iframe);
        const metaEl = card.querySelector(`#vmeta-${v.id}`);
        const newViews = (v.views || 0) + 1;
        metaEl.textContent = newViews + ' просмотров';
        await updateDoc(doc(db, 'videos', v.id), { views: increment(1) });
      });

      /* like */
      card.querySelector(`#vl-${v.id}`).addEventListener('click', async () => {
        const cur = localStorage.getItem(voteKey(v.id));
        const likeBtn    = card.querySelector(`#vl-${v.id}`);
        const likeEl     = card.querySelector(`#vl-c-${v.id}`);
        const dislikeBtn = card.querySelector(`#vd-${v.id}`);
        const dislikeEl  = card.querySelector(`#vd-c-${v.id}`);
        if (cur === 'like') {
          await updateDoc(doc(db,'videos',v.id), { likes: increment(-1) });
          localStorage.removeItem(voteKey(v.id));
          likeBtn.classList.remove('active-like');
          likeEl.textContent = parseInt(likeEl.textContent) - 1;
        } else {
          if (cur === 'dislike') {
            await updateDoc(doc(db,'videos',v.id), { dislikes: increment(-1) });
            dislikeBtn.classList.remove('active-dislike');
            dislikeEl.textContent = parseInt(dislikeEl.textContent) - 1;
          }
          await updateDoc(doc(db,'videos',v.id), { likes: increment(1) });
          localStorage.setItem(voteKey(v.id), 'like');
          likeBtn.classList.add('active-like');
          likeEl.textContent = parseInt(likeEl.textContent) + 1;
        }
      });

      /* dislike */
      card.querySelector(`#vd-${v.id}`).addEventListener('click', async () => {
        const cur = localStorage.getItem(voteKey(v.id));
        const likeBtn    = card.querySelector(`#vl-${v.id}`);
        const likeEl     = card.querySelector(`#vl-c-${v.id}`);
        const dislikeBtn = card.querySelector(`#vd-${v.id}`);
        const dislikeEl  = card.querySelector(`#vd-c-${v.id}`);
        if (cur === 'dislike') {
          await updateDoc(doc(db,'videos',v.id), { dislikes: increment(-1) });
          localStorage.removeItem(voteKey(v.id));
          dislikeBtn.classList.remove('active-dislike');
          dislikeEl.textContent = parseInt(dislikeEl.textContent) - 1;
        } else {
          if (cur === 'like') {
            await updateDoc(doc(db,'videos',v.id), { likes: increment(-1) });
            likeBtn.classList.remove('active-like');
            likeEl.textContent = parseInt(likeEl.textContent) - 1;
          }
          await updateDoc(doc(db,'videos',v.id), { dislikes: increment(1) });
          localStorage.setItem(voteKey(v.id), 'dislike');
          dislikeBtn.classList.add('active-dislike');
          dislikeEl.textContent = parseInt(dislikeEl.textContent) + 1;
        }
      });

      /* toggle comments */
      let commentsLoaded = false;
      card.querySelector(`#vtog-${v.id}`).addEventListener('click', async () => {
        const sec = card.querySelector(`#vc-${v.id}`);
        const btn = card.querySelector(`#vtog-${v.id}`);
        const t2  = navStrings[localStorage.getItem('st-lang')||'ru'];
        const isOpen = btn.dataset.open === '1';
        if (isOpen) {
          sec.classList.remove('open'); btn.dataset.open='0'; btn.textContent = t2.showComments;
        } else {
          sec.classList.add('open'); btn.dataset.open='1'; btn.textContent = t2.hideComments;
          if (!commentsLoaded) { commentsLoaded = true; await refreshComments(v.id, card); }
        }
      });

      /* send comment */
      card.querySelector(`#vs-${v.id}`).addEventListener('click', async () => {
        const text = card.querySelector(`#vt-${v.id}`).value.trim();
        if (!text) return;
        await addDoc(collection(db,'videos',v.id,'comments'), { author: '', text, createdAt: serverTimestamp() });
        card.querySelector(`#vt-${v.id}`).value = '';
        await refreshComments(v.id, card);
      });

      return card;
    }

    async function init() {
      const container = document.getElementById('videos-container');
      container.innerHTML = '<div class="loading-text">Загрузка…</div>';
      const q = query(collection(db,'videos'), orderBy('createdAt','desc'));
      const snap = await getDocs(q);
      container.innerHTML = '';
      if (snap.empty) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">🎬</div><div class="empty-text">Видео пока нет</div></div>';
        return;
      }
      snap.docs.forEach(d => {
        const card = buildVideoCard({ id: d.id, ...d.data() });
        container.appendChild(card);
      });
    }
    init();
  </script>
</body>
</html>
